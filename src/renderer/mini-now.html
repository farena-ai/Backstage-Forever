<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"><title>Backstage Forever mini Now</title><link rel="stylesheet" href="mini-now.css"></head>
<body><div class="mn-shell" data-mini-now><header class="mn-bar"><span class="mn-title" data-mn-who>Backstage Forever</span><button type="button" data-mn="close" title="Close">✕</button></header>
<main class="mn-body" aria-label="Your next step">
  <div data-mn-step><p class="mn-msg">Reading your next step…</p></div>
  <details class="mn-details" data-mn-details-panel hidden>
    <summary>Details</summary>
    <div class="mn-detail-content" data-mn-details></div>
    <button type="button" data-mn="open-now">Open Now</button>
  </details>
  <p class="mn-screen-reader" data-mn-announcement aria-live="polite" aria-atomic="true"></p>
</main></div>
<script src="mini-now.js"></script></body></html>
