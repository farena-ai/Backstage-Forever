<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"><title>Backstage Forever answer</title><link rel="stylesheet" href="ask-panel.css"></head>
<body><main class="ap-shell" data-ask-panel data-status="thinking">
<header class="ap-bar"><img class="ap-crest" src="art/pins/companion.png" alt="" width="26" height="26"><span class="ap-title">Backstage Forever</span><span class="ap-when" data-ap-when></span><button type="button" class="ap-x" data-ap="close" title="Close" aria-label="Close">✕</button></header>
<section class="ap-body" data-ap-body>
<p class="ap-question"><span class="ap-label">You asked</span> <span data-ap-question></span></p>
<div class="ap-answer companion-reply" data-ap-answer role="status" aria-live="polite"><p class="ap-thinking">Thinking…</p></div>
<p class="ap-note" data-ap-note hidden></p>
</section>
<footer class="ap-foot"><span class="ap-source" data-ap-source></span><button type="button" class="ap-open" data-ap="open">Open in app</button></footer>
</main>
<script src="companion-reply.js"></script>
<script src="ask-panel.js"></script></body></html>
