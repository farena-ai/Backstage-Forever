# Paste into the .htaccess of the bf.backstagecoding.com document root
# (the cPanel account that owns that subdomain). It forwards only /v1/* (the
# app's API), /admin/* (the Backstage Desk admin area) and /discord/* (Discord's
# webhook and the two small pages of the Discord link) to the loopback service
# on gnome; nothing else on the subdomain is affected.
# All three are HTTPS only: plain HTTP is redirected with 308 before anything is
# proxied, so the admin session cookie (Secure, __Host- prefix) never travels
# in the clear.
# Requires mod_proxy/mod_proxy_http (already used by FrankGate on this server).
# If you replace an older copy of this block, replace all of it.
#
# /v1/live/stream is a long-lived event stream (Server-Sent Events). It must
# reach the app event by event, so compression is switched off for that one
# address (mod_deflate collects output before it sends). mod_proxy_http itself
# passes each piece on as soon as the service has nothing more to send, and the
# service sends a line every 20 seconds, which keeps the connection inside the
# web server's Timeout / ProxyTimeout (60 seconds or more). See OPERATIONS.md,
# "Backstage Live", for how to check this on the live host.
# BEGIN BF COMMUNITY
RewriteEngine On
RewriteCond %{HTTPS} !=on
RewriteRule ^(v1|admin|discord)(/|$) https://%{HTTP_HOST}%{REQUEST_URI} [R=308,L]
SetEnvIf Request_URI "^/v1/live/stream$" no-gzip=1 dont-vary=1
RewriteRule ^v1/live/stream$ http://127.0.0.1:5081/v1/live/stream [P,L,QSA,E=no-gzip:1,E=dont-vary:1]
RewriteRule ^v1/(.*)$ http://127.0.0.1:5081/v1/$1 [P,L,QSA]
RewriteRule ^discord/(.*)$ http://127.0.0.1:5081/discord/$1 [P,L,QSA]
RewriteRule ^admin$ /admin/ [R=308,L]
RewriteRule ^admin/(.*)$ http://127.0.0.1:5081/admin/$1 [P,L,QSA]
# END BF COMMUNITY
