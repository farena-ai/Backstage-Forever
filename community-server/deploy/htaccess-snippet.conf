# Paste into the .htaccess of the bf.backstagecoding.com document root
# (the cPanel account that owns that subdomain). It forwards only /v1/* to the
# loopback service on gnome; nothing else on the subdomain is affected.
# Requires mod_proxy/mod_proxy_http (already used by FrankGate on this server).
# BEGIN BF COMMUNITY
RewriteEngine On
RewriteCond %{HTTPS} !=on
RewriteRule ^v1/ https://%{HTTP_HOST}%{REQUEST_URI} [R=308,L]
RewriteRule ^v1/(.*)$ http://127.0.0.1:5081/v1/$1 [P,L,QSA]
# END BF COMMUNITY
