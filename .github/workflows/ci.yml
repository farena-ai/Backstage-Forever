name: Windows validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:addon-reference
      - run: npm run check:find-index
      - run: npm run check:forever-vendors
      - run: npm run check:forever-insights
      - run: npm run check:forever-travel
      - run: npm run check:forever-acquisition
      - run: npm run check:forever-npc-locations
      - run: npm test
      - run: npm run test:ui
      - run: npm run test:setup
      - run: npm run test:autosave
      - run: npm run test:integration
      - run: npm run test:living-backend
      - run: npm run test:living-setup
      - run: npm run test:company-backend
      - run: npm run test:company
      - run: npm run test:director-backend
      - run: npm run test:director
      - run: npm run test:preparation-backend
      - run: npm run test:preparation
      - run: npm run test:adventure-coach
      - run: npm run test:profession-coach
      - run: npm run test:memory-backend
      - run: npm run test:voice-backend
      - run: npm run test:voice-memory
      - run: npm run test:travel-companion
      - run: npm run test:npc-companion
      - run: npm run test:companion-tools
      - run: npm run test:live-link
      - run: npm run test:world-map
      - run: npm run test:now
      - run: npm run test:conversation
      - run: npm run test:companion-recovery
      - run: npm run test:player-shell
      - run: npm run test:product-polish
      - run: npm run test:support
      - run: npm run test:recovery
      - run: npm run test:party-backend
      - run: npm run test:party
      - run: npm run test:command-center
      - run: npm run test:knowledge
      - run: npm run test:insights
      - run: npm run test:character-guidance
      - run: npm run dist
      - run: npm run test:packaged
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-test-diagnostics
          path: work/*failure.png
      - uses: actions/upload-artifact@v4
        with:
          name: windows-preview-unsigned
          path: dist/*.exe
