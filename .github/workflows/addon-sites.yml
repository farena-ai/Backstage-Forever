name: Addon sites

# Packages the in-game addon (addon/BackstageForever) with the BigWigs packager, which knows the
# WoW Forever flavor (Interface 16xxx). Pull requests only build and check the package. A release
# tag also uploads it to CurseForge, Wago Addons and WoWInterface, each only once its project ID
# (repository variable) and API token (repository secret) are set; see docs/DISTRIBUTION.md.
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package the addon (uploads only on release tags with tokens set)
        uses: BigWigsMods/packager@v2
        with:
          args: >-
            -t addon/BackstageForever -g forever -n "BackstageForever-{project-version}"
            ${{ github.event_name != 'push' && '-d' || '' }}
            ${{ vars.CURSEFORGE_PROJECT_ID && format('-p {0}', vars.CURSEFORGE_PROJECT_ID) || '' }}
            ${{ vars.WAGO_PROJECT_ID && format('-a {0}', vars.WAGO_PROJECT_ID) || '' }}
            ${{ vars.WOWI_ADDON_ID && format('-w {0}', vars.WOWI_ADDON_ID) || '' }}
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      - name: Keep the package for review
        uses: actions/upload-artifact@v4
        with:
          name: BackstageForever-addon
          path: addon/BackstageForever/.release/*.zip
          if-no-files-found: error
