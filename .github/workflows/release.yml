name: Production release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'farena-ai/Backstage-Forever'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate explicit release tag
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = $package.version
          $channel = $package.releaseChannel
          if ($channel -cnotin @('preview', 'stable')) { throw 'package releaseChannel must be preview or stable' }
          "RELEASE_CHANNEL=$channel" >> $env:GITHUB_ENV
          if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' -or $env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag must match strict package version' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - run: npm ci
      - run: npm run check:addon-reference
      - run: npm run check:find-index
      - run: npm run check:addon-advisor
      - run: npm run check:forever-vendors
      - run: npm run check:forever-insights
      - run: npm run check:forever-travel
      - run: npm run check:forever-acquisition
      - run: npm run check:forever-npc-locations
      - run: npm run check:forever-creatures
      - run: npm run check:forever-loot
      - run: npm run check:whats-new
      - run: npm test
      - run: npm run test:ui
        timeout-minutes: 10
      - run: npm run test:setup
        timeout-minutes: 10
      - run: npm run test:autosave
        timeout-minutes: 10
      - run: npm run test:integration
        timeout-minutes: 10
      - run: npm run test:living-backend
        timeout-minutes: 10
      - run: npm run test:living-setup
        timeout-minutes: 10
      - run: npm run test:company-backend
        timeout-minutes: 10
      - run: npm run test:company
        timeout-minutes: 10
      - run: npm run test:director-backend
        timeout-minutes: 10
      - run: npm run test:director
        timeout-minutes: 10
      - run: npm run test:preparation-backend
        timeout-minutes: 10
      - run: npm run test:preparation
        timeout-minutes: 10
      - run: npm run test:adventure-coach
        timeout-minutes: 10
      - run: npm run test:profession-coach
        timeout-minutes: 10
      - run: npm run test:memory-backend
        timeout-minutes: 10
      - run: npm run test:voice-backend
        timeout-minutes: 10
      - run: npm run test:voice-memory
        timeout-minutes: 10
      - run: npm run test:travel-companion
        timeout-minutes: 10
      - run: npm run test:npc-companion
        timeout-minutes: 10
      - run: npm run test:companion-tools
        timeout-minutes: 10
      - run: npm run test:live-link
        timeout-minutes: 10
      - run: npm run test:world-map
        timeout-minutes: 10
      - run: npm run test:now
        timeout-minutes: 10
      - run: npm run test:conversation
        timeout-minutes: 10
      - run: npm run test:companion-recovery
        timeout-minutes: 10
      - run: npm run test:player-shell
        timeout-minutes: 10
      - run: npm run test:product-polish
        timeout-minutes: 10
      - run: npm run test:support
        timeout-minutes: 10
      - run: npm run test:recovery
        timeout-minutes: 10
      - run: npm run test:party-backend
        timeout-minutes: 10
      - run: npm run test:party
        timeout-minutes: 10
      - run: npm run test:command-center
        timeout-minutes: 10
      - run: npm run test:knowledge
        timeout-minutes: 10
      - run: npm run test:insights
        timeout-minutes: 10
      - run: npm run test:character-guidance
        timeout-minutes: 10
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run test:packaged
        timeout-minutes: 10
      - name: Verify staged Windows publisher signature
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RELEASE_CHANNEL -cne 'stable') { return }
          $tag = $env:GITHUB_REF_NAME
          $name = "Backstage-Forever-$env:RELEASE_VERSION-Windows-x64-Setup.exe"
          $json = gh release view $tag --repo $env:GITHUB_REPOSITORY --json targetCommitish,assets
          if ($LASTEXITCODE -ne 0) { throw 'Stable release needs a draft with a locally signed installer' }
          $staged = $json | ConvertFrom-Json
          if ($staged.targetCommitish -cne $env:GITHUB_SHA) { throw 'Staged release must target this exact release commit' }
          $assets = @($staged.assets | Where-Object { $_.name -ceq $name })
          if ($assets.Count -ne 1) { throw 'Exactly one staged Windows installer is required' }
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern $name --dir dist --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the staged Windows installer' }
          $file = Get-Item -LiteralPath "dist/$name"
          $sig = Get-AuthenticodeSignature -LiteralPath $file.FullName
          if ($sig.Status -ne 'Valid' -or !$sig.TimeStamperCertificate -or $sig.SignerCertificate.GetNameInfo('SimpleName', $false) -cne 'Frank Arena') { throw 'Expected a valid timestamped Frank Arena publisher signature' }
          if ($file.VersionInfo.ProductVersion -cnotin @($env:RELEASE_VERSION, "$env:RELEASE_VERSION.0")) { throw 'Staged installer version does not match the release' }
      - name: Sign application update manifest
        shell: pwsh
        env:
          BF_UPDATE_SIGNING_KEY: ${{ secrets.BF_UPDATE_SIGNING_KEY }}
        run: |
          node scripts/sign-update.cjs --installer "dist/Backstage-Forever-$env:RELEASE_VERSION-Windows-x64-Setup.exe" --version "$env:RELEASE_VERSION" --output dist/backstage-update.json
          if ($LASTEXITCODE -ne 0) { throw 'Manifest signing failed' }
      - name: Create source archive and checksums
        shell: pwsh
        run: |
          git archive --format=zip --output="dist/Backstage-Forever-$env:RELEASE_VERSION-Source.zip" "$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          # The in-game addon alone (unzips to AddOns\BackstageForever), for manual installs and addon sites.
          git archive --format=zip --prefix=BackstageForever/ --output="dist/BackstageForever-Addon-$env:RELEASE_VERSION.zip" "$($env:GITHUB_REF_NAME):addon/BackstageForever"
          if ($LASTEXITCODE -ne 0) { throw 'Addon archive failed' }
          $names = @("Backstage-Forever-$env:RELEASE_VERSION-Windows-x64-Setup.exe", "Backstage-Forever-$env:RELEASE_VERSION-Source.zip", "BackstageForever-Addon-$env:RELEASE_VERSION.zip", 'backstage-update.json')
          $lines = foreach ($name in $names) { $hash = (Get-FileHash -LiteralPath "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant(); "$hash  $name" }
          # LF line endings so `shasum -c` / `sha256sum -c` work on Mac and Linux too.
          [IO.File]::WriteAllText((Join-Path $pwd 'dist/SHA256SUMS.txt'), (($lines -join "`n") + "`n"), [Text.UTF8Encoding]::new($false))
      - name: Publish or update versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $existing = gh release view $tag --repo "$env:GITHUB_REPOSITORY" --json isDraft,isPrerelease 2>$null
          $existed = $LASTEXITCODE -eq 0
          if (-not $existed) {
            $createArguments = @('release', 'create', $tag, '--repo', $env:GITHUB_REPOSITORY, '--verify-tag', '--draft', '--title', "Backstage Forever $env:RELEASE_VERSION")
            $notes = "docs/releases/$env:RELEASE_VERSION.md"
            if (Test-Path -LiteralPath $notes) { $createArguments += @('--notes-file', $notes) } else { $createArguments += '--generate-notes' }
            if ($env:RELEASE_CHANNEL -ceq 'preview') { $createArguments += '--prerelease' }
            gh @createArguments
            if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
          }
          $files = @("dist/Backstage-Forever-$env:RELEASE_VERSION-Source.zip", "dist/BackstageForever-Addon-$env:RELEASE_VERSION.zip", 'dist/backstage-update.json', 'dist/SHA256SUMS.txt')
          if ($env:RELEASE_CHANNEL -cne 'stable') { $files += "dist/Backstage-Forever-$env:RELEASE_VERSION-Windows-x64-Setup.exe" }
          gh release upload $tag @files --clobber --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
          # Published releases retain their current preview/stable status on reruns.
          if (-not $existed -or ($existing | ConvertFrom-Json).isDraft) {
            $preview = if ($env:RELEASE_CHANNEL -ceq 'preview') { 'true' } else { 'false' }
            gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --draft=false "--prerelease=$preview"
            if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; assets remain in draft' }
          }
  mac:
    # 4.6 (0.55): an unsigned Mac build of the same version, added to the release the Windows job published.
    needs: release
    if: github.repository == 'farena-ai/Backstage-Forever'
    # macos-14 is not offered to this repository (0.55.0's Mac job was refused); macos-latest builds both archs.
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # The full test suite runs in the Windows job above; this job only packages the same, tested commit.
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # electron-builder leaves the app with no signature at all (identity: null), and Apple Silicon will not
      # run that. An ad-hoc signature is free, needs no Apple account, and lets "Open Anyway" work.
      - name: Ad-hoc sign each Mac app and zip it again
        run: |
          set -euo pipefail
          cd dist
          for z in Backstage-Forever-*-macOS-*.zip; do
            rm -rf sign && mkdir sign && ditto -x -k "$z" sign
            codesign --force --deep --sign - "sign/Backstage Forever.app"
            codesign --verify --deep --strict "sign/Backstage Forever.app"
            rm "$z" && ditto -c -k --sequesterRsrc --keepParent "sign/Backstage Forever.app" "$z"
          done
          rm -rf sign
      - name: Add the Mac builds and their checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"; version="${tag#v}"
          cd dist
          ls Backstage-Forever-"$version"-macOS-*.zip
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --clobber
          tr -d '\r' < SHA256SUMS.txt | grep -v -- '-macOS-' > sums.tmp || true
          shasum -a 256 Backstage-Forever-"$version"-macOS-*.zip >> sums.tmp
          mv sums.tmp SHA256SUMS.txt
          gh release upload "$tag" Backstage-Forever-"$version"-macOS-*.zip SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
